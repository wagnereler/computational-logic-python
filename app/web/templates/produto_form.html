{% extends "base.html" %}{% block content %}<section class="card narrow"><h1>{{ 'Editar produto' if produto else 'Novo produto' }}</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><label>Nome<input name="nome" required value="{{ produto.nome if produto else '' }}"></label><label>Preço<input name="preco" required inputmode="decimal" value="{{ produto.preco if produto else '' }}"></label><label>Quantidade<input name="quantidade" type="number" min="0" step="1" required value="{{ produto.quantidade if produto else '' }}"></label><button>Salvar</button></form><a href="/produtos">Voltar</a></section>{% endblock %}
