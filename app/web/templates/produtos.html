{% extends "base.html" %}{% block content %}<div class="heading"><h1>Estoque</h1><a class="button" href="/produtos/novo">Adicionar produto</a></div><div class="card"><table><thead><tr><th>ID</th><th>Nome</th><th>Preço</th><th>Quantidade</th><th>Ações</th></tr></thead><tbody>{% for produto in produtos %}<tr><td>{{ produto.id }}</td><td>{{ produto.nome }}</td><td>{{ produto.preco|money }}</td><td>{{ produto.quantidade }}</td><td><a href="/produtos/{{ produto.id }}/editar">Editar</a><form class="inline" method="post" action="/produtos/{{ produto.id }}/excluir"><button class="link" onclick="return confirm('Excluir este produto?')">Excluir</button></form></td></tr>{% else %}<tr><td colspan="5">Nenhum produto cadastrado.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
